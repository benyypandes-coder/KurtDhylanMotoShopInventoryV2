name: Build Kurt Dhylan Moto Shop APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found in repository root."
            exit 1
          fi
          echo "Using $ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

          # If the ZIP has one wrapper folder, move its contents to project root.
          if [ "$(find project -mindepth 1 -maxdepth 1 | wc -l)" -eq 1 ] && [ -d "$(find project -mindepth 1 -maxdepth 1 -type d)" ]; then
            INNER="$(find project -mindepth 1 -maxdepth 1 -type d)"
            shopt -s dotglob
            cp -a "$INNER"/* project/
            rm -rf "$INNER"
          fi

          echo "Project contents:"
          find project -maxdepth 3 -type f | sort

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI Android
        run: dotnet workload install maui-android

      - name: Verify project
        run: |
          test -f project/KurtDhylanMotoShopInventory.csproj
          echo "Project found."

      - name: Restore
        working-directory: project
        run: dotnet restore KurtDhylanMotoShopInventory.csproj

      - name: Build APK
        working-directory: project
        run: |
          dotnet publish KurtDhylanMotoShopInventory.csproj \
            -f net10.0-android \
            -c Release \
            -p:AndroidPackageFormat=apk \
            --no-restore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kurt-Dhylan-Moto-Shop-Inventory-APK
          path: "project/bin/Release/net10.0-android/**/*.apk"
          if-no-files-found: error
