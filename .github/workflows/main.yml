name: Build Kurt Dhylan Moto Shop APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found in repository root."
            exit 1
          fi
          rm -rf project
          mkdir project
          unzip -q "$ZIP_FILE" -d project

          # Handle either root-level files or a single wrapper folder.
          if [ ! -f project/KurtDhylanMotoShopInventory.csproj ]; then
            INNER=$(find project -mindepth 1 -maxdepth 1 -type d | head -n 1)
            if [ -n "$INNER" ] && [ -f "$INNER/KurtDhylanMotoShopInventory.csproj" ]; then
              cp -a "$INNER"/. project/
            fi
          fi

          test -f project/KurtDhylanMotoShopInventory.csproj

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install MAUI Android
        run: dotnet workload install maui-android

      - name: Restore
        working-directory: project
        run: dotnet restore KurtDhylanMotoShopInventory.csproj

      - name: Publish APK
        working-directory: project
        run: |
          dotnet publish KurtDhylanMotoShopInventory.csproj             -f net10.0-android             -c Release             -p:AndroidPackageFormat=apk             --no-restore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kurt-Dhylan-Moto-Shop-Inventory-APK
          path: "project/bin/Release/net10.0-android/**/*.apk"
          if-no-files-found: error
